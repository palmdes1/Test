<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>RC Racing Sim — 1/10 EP Touring Car</title>
<style>
  html, body { margin: 0; padding: 0; overflow: hidden; background: #1a1d24; }
  canvas { display: block; }
  #help {
    position: fixed; bottom: 10px; right: 16px; color: #cfd6e2;
    font: 13px/1.5 sans-serif; background: rgba(10,12,18,.8);
    padding: 10px 14px; border-radius: 6px;
  }
  #help b { color: #fff; }
  #trackname {
    position: fixed; top: 170px; right: 16px; color: #cfd6e2;
    font: bold 14px sans-serif;
  }
  #setupPanel {
    display: none; position: fixed; left: 16px; top: 130px; width: 270px;
    background: rgba(10,12,18,.92); color: #dfe4ee; padding: 12px 16px;
    border-radius: 8px; font: 13px/1.6 sans-serif; max-height: 75vh; overflow-y: auto;
  }
  #setupPanel h3 { margin: 2px 0 6px; }
  #setupPanel .grp { color: #ffb45a; font-weight: bold; margin-top: 8px; }
  #setupPanel label { display: block; margin: 4px 0; }
  #setupPanel input[type=range] { width: 150px; vertical-align: middle; }
  #setupPanel .val { color: #7aff8c; margin-left: 6px; }
  #setupPanel button { margin: 10px 6px 2px 0; padding: 5px 10px; }
</style>
</head>
<body>
<canvas id="view"></canvas>
<div id="trackname">OVAL</div>
<div id="setupPanel"></div>
<div id="help">
  <b>&uarr;</b> throttle &nbsp; <b>&darr;</b>/<b>space</b> brake &nbsp; <b>&larr;&rarr;</b> steer<br>
  <b>A</b> AI drive &nbsp; <b>C</b> camera &nbsp; <b>R</b> reset &nbsp; <b>M</b> motor<br>
  <b>1</b> oval &nbsp; <b>2</b> figure-8 &nbsp; <b>3</b> luxembourg (5.5T)<br>
  <b>T</b> setup &nbsp; <b>G</b> calibrate RC radio (USB adapter)
</div>
<script type="module" src="web/main.js"></script>
</body>
</html>
