<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="icon" href="data:,">
<title>Red Clay Ridge — World's Best Offroad RC Track</title>
<style>
  html, body { margin: 0; padding: 0; overflow: hidden; background: #10141c; }
  canvas { display: block; }
  .panel {
    position: fixed; color: #e8edf6; font: 13px/1.55 system-ui, sans-serif;
    background: rgba(10, 13, 20, .78); border: 1px solid rgba(255,255,255,.09);
    padding: 12px 16px; border-radius: 10px; backdrop-filter: blur(4px);
  }
  #title { top: 14px; left: 16px; max-width: 330px; }
  #title h1 { margin: 0 0 2px; font-size: 19px; letter-spacing: .5px; color: #ffb45a; }
  #title .sub { color: #9fb0c8; font-size: 12px; margin-bottom: 8px; }
  #title .chips { display: flex; flex-wrap: wrap; gap: 4px; }
  #title .chips span {
    background: rgba(255,180,90,.14); color: #ffd9a8; border-radius: 20px;
    padding: 1px 9px; font-size: 11px; white-space: nowrap;
  }
  #hud { top: 14px; right: 16px; text-align: right; min-width: 150px; }
  #hud .speed { font-size: 26px; font-weight: 700; color: #7aff8c; }
  #hud .speed small { font-size: 12px; color: #9fb0c8; font-weight: 400; }
  #hud .lap { color: #cfd6e2; font-size: 12px; margin-top: 2px; }
  #hud .air { color: #6ec4ff; font-size: 13px; font-weight: 700; height: 17px; }
  #controls { bottom: 14px; right: 16px; }
  #controls b { color: #fff; }
  #cams { bottom: 14px; left: 16px; display: flex; gap: 6px; padding: 8px 10px; }
  #cams button {
    background: rgba(255,255,255,.08); color: #cfd6e2; border: 1px solid rgba(255,255,255,.14);
    border-radius: 6px; padding: 5px 12px; font: 12px system-ui, sans-serif; cursor: pointer;
  }
  #cams button.on { background: #ffb45a; color: #201408; border-color: #ffb45a; font-weight: 700; }
  #loading {
    position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
    color: #ffb45a; font: 16px system-ui, sans-serif; background: #10141c; z-index: 10;
  }
</style>
</head>
<body>
<div id="loading">building red clay ridge…</div>
<div id="title" class="panel">
  <h1>RED CLAY RIDGE</h1>
  <div class="sub">world's best offroad RC raceway &mdash; 1/8 scale, 385 m of sculpted clay</div>
  <div class="chips">
    <span>big triple</span><span>double&#8209;double rhythm</span><span>tabletop</span>
    <span>step&#8209;up</span><span>sky drop</span><span>whoops</span>
    <span>6 banked berms</span><span>elevated bowl sweeper</span>
  </div>
</div>
<div id="hud" class="panel">
  <div class="speed"><span id="spd">0</span> <small>km/h</small></div>
  <div class="lap">lap <span id="lap">1</span> &nbsp; last <span id="lastlap">&ndash;:&ndash;&ndash;</span></div>
  <div class="air" id="air"></div>
</div>
<div id="cams" class="panel">
  <button id="camOrbit" class="on">orbit</button>
  <button id="camChase">chase</button>
  <button id="camStand">stand</button>
  <button id="camOnboard">onboard</button>
</div>
<div id="controls" class="panel">
  <b>drag</b> orbit &nbsp; <b>scroll</b> zoom &nbsp; <b>C</b> camera
</div>
<script type="importmap">
{ "imports": { "three": "./vendor/three.module.min.js", "three/addons/": "./vendor/" } }
</script>
<script type="module" src="main.js"></script>
</body>
</html>
